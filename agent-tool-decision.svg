<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#29B5E8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#27AE60"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7B1FA2"/>
    </marker>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#29B5E8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E88C7;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="550" y="32" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Agent Tool Selection - Decision Flow</text>
  <text x="550" y="52" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">How LERETA_INTELLIGENCE_AGENT routes questions to the right tool</text>

  <!-- User Question (top center) -->
  <rect x="400" y="70" width="300" height="50" rx="25" fill="url(#gradHeader)" filter="url(#shadow)"/>
  <text x="550" y="100" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Natural Language Question</text>

  <!-- Decision diamond area -->
  <polygon points="550,140 650,180 550,220 450,180" fill="white" stroke="#29B5E8" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="177" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#29B5E8">Question Type?</text>

  <!-- Three branches -->
  <!-- Left: Structured Data -->
  <line x1="450" y1="180" x2="200" y2="180" stroke="#29B5E8" stroke-width="2"/>
  <line x1="200" y1="180" x2="200" y2="240" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="325" y="170" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#29B5E8">Structured / Analytics</text>

  <!-- Center: Unstructured Search -->
  <line x1="550" y1="220" x2="550" y2="240" stroke="#7B1FA2" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="550" y="235" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7B1FA2">Document Search</text>

  <!-- Right: Predictive -->
  <line x1="650" y1="180" x2="900" y2="180" stroke="#27AE60" stroke-width="2"/>
  <line x1="900" y1="180" x2="900" y2="240" stroke="#27AE60" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="775" y="170" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27AE60">Predictive / ML</text>

  <!-- ===== LEFT COLUMN: Cortex Analyst (Structured) ===== -->
  <rect x="50" y="245" width="300" height="30" rx="6" fill="#29B5E8" filter="url(#shadow)"/>
  <text x="200" y="265" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Cortex Analyst (Text-to-SQL)</text>

  <!-- Tool 1 -->
  <rect x="50" y="290" width="300" height="110" rx="8" fill="white" stroke="#29B5E8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="290" width="300" height="25" rx="8" fill="#E3F5FC"/>
  <text x="200" y="307" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1E88C7">PropertyLoanTaxAnalyst</text>
  <text x="65" y="330" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"How many clients do we have?"</text>
  <text x="65" y="347" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Properties with delinquent taxes by state"</text>
  <text x="65" y="364" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Average loan amount by loan type"</text>
  <text x="65" y="381" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Flood certifications requiring insurance"</text>
  <text x="65" y="395" font-family="Inter, Arial, sans-serif" font-size="8" fill="#999">Scope: clients, properties, loans, tax records, flood certs</text>

  <!-- Tool 2 -->
  <rect x="50" y="415" width="300" height="95" rx="8" fill="white" stroke="#29B5E8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="415" width="300" height="25" rx="8" fill="#E3F5FC"/>
  <text x="200" y="432" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1E88C7">SubscriptionRevenueAnalyst</text>
  <text x="65" y="455" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Total revenue this quarter"</text>
  <text x="65" y="472" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Active subscriptions by tier"</text>
  <text x="65" y="489" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Top products by revenue"</text>
  <text x="65" y="505" font-family="Inter, Arial, sans-serif" font-size="8" fill="#999">Scope: subscriptions, transactions, products, revenue</text>

  <!-- Tool 3 -->
  <rect x="50" y="525" width="300" height="95" rx="8" fill="white" stroke="#29B5E8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="525" width="300" height="25" rx="8" fill="#E3F5FC"/>
  <text x="200" y="542" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1E88C7">ClientSupportAnalyst</text>
  <text x="65" y="565" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"How many open tickets?"</text>
  <text x="65" y="582" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Average resolution time by priority"</text>
  <text x="65" y="599" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Agent satisfaction ratings"</text>
  <text x="65" y="615" font-family="Inter, Arial, sans-serif" font-size="8" fill="#999">Scope: support tickets, agents, satisfaction metrics</text>

  <!-- ===== CENTER COLUMN: Cortex Search (Unstructured) ===== -->
  <rect x="400" y="245" width="300" height="30" rx="6" fill="#7B1FA2" filter="url(#shadow)"/>
  <text x="550" y="265" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Cortex Search (Semantic)</text>

  <!-- Tool 4 -->
  <rect x="400" y="290" width="300" height="95" rx="8" fill="white" stroke="#7B1FA2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="400" y="290" width="300" height="25" rx="8" fill="#F3E5F5"/>
  <text x="550" y="307" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#7B1FA2">SupportTranscriptsSearch</text>
  <text x="415" y="330" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Find cases about escrow discrepancies"</text>
  <text x="415" y="347" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"How did we resolve API timeout issues?"</text>
  <text x="415" y="364" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Customer complaints about payment delays"</text>
  <text x="415" y="380" font-family="Inter, Arial, sans-serif" font-size="8" fill="#999">Corpus: 25K support interaction transcripts</text>

  <!-- Tool 5 -->
  <rect x="400" y="400" width="300" height="95" rx="8" fill="white" stroke="#7B1FA2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="400" y="400" width="300" height="25" rx="8" fill="#F3E5F5"/>
  <text x="550" y="417" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#7B1FA2">TaxDisputeSearch</text>
  <text x="415" y="440" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Homestead exemption applications"</text>
  <text x="415" y="457" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Cases where duplicate payments occurred"</text>
  <text x="415" y="474" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Veteran disability exemption examples"</text>
  <text x="415" y="490" font-family="Inter, Arial, sans-serif" font-size="8" fill="#999">Corpus: 15K tax dispute and appeal documents</text>

  <!-- Tool 6 -->
  <rect x="400" y="510" width="300" height="95" rx="8" fill="white" stroke="#7B1FA2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="400" y="510" width="300" height="25" rx="8" fill="#F3E5F5"/>
  <text x="550" y="527" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#7B1FA2">FloodReportsSearch</text>
  <text x="415" y="550" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Properties in Zone AE requiring insurance"</text>
  <text x="415" y="567" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"LOMA review process documentation"</text>
  <text x="415" y="584" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"FEMA map change impacts"</text>
  <text x="415" y="600" font-family="Inter, Arial, sans-serif" font-size="8" fill="#999">Corpus: 20K flood determination reports</text>

  <!-- ===== RIGHT COLUMN: ML Models (Predictive) ===== -->
  <rect x="750" y="245" width="300" height="30" rx="6" fill="#27AE60" filter="url(#shadow)"/>
  <text x="900" y="265" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">ML Models (Predictive)</text>

  <!-- Tool 7 -->
  <rect x="750" y="290" width="300" height="105" rx="8" fill="white" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="750" y="290" width="300" height="25" rx="8" fill="#E8F5E9"/>
  <text x="900" y="307" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#27AE60">PredictTaxDelinquencyRisk</text>
  <text x="765" y="330" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Predict tax delinquency for all properties"</text>
  <text x="765" y="347" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Which TX properties may go delinquent?"</text>
  <text x="765" y="364" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Assess tax payment risk in California"</text>
  <text x="765" y="382" font-family="Inter, Arial, sans-serif" font-size="8" fill="#999">Model: Random Forest | Input: state filter or NULL</text>
  <text x="765" y="393" font-family="Inter, Arial, sans-serif" font-size="8" fill="#999">Output: Delinquent vs Not Delinquent distribution</text>

  <!-- Tool 8 -->
  <rect x="750" y="410" width="300" height="105" rx="8" fill="white" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="750" y="410" width="300" height="25" rx="8" fill="#E8F5E9"/>
  <text x="900" y="427" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#27AE60">PredictClientChurnRisk</text>
  <text x="765" y="450" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Which clients are at risk of leaving?"</text>
  <text x="765" y="467" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Predict churn for regional lenders"</text>
  <text x="765" y="484" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Client retention risk assessment"</text>
  <text x="765" y="502" font-family="Inter, Arial, sans-serif" font-size="8" fill="#999">Model: XGBoost | Input: client_type filter or NULL</text>
  <text x="765" y="513" font-family="Inter, Arial, sans-serif" font-size="8" fill="#999">Output: Low / Medium / High risk distribution</text>

  <!-- Tool 9 -->
  <rect x="750" y="530" width="300" height="105" rx="8" fill="white" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="750" y="530" width="300" height="25" rx="8" fill="#E8F5E9"/>
  <text x="900" y="547" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#27AE60">ClassifyLoanRisk</text>
  <text x="765" y="570" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Classify all loans by risk level"</text>
  <text x="765" y="587" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"Risk assessment for FHA loans"</text>
  <text x="765" y="604" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">"How many loans are high risk?"</text>
  <text x="765" y="622" font-family="Inter, Arial, sans-serif" font-size="8" fill="#999">Model: Random Forest | Input: loan_type filter or NULL</text>
  <text x="765" y="633" font-family="Inter, Arial, sans-serif" font-size="8" fill="#999">Output: LOW / MEDIUM / HIGH classification</text>

  <!-- Footer Legend -->
  <rect x="50" y="655" width="1000" height="35" rx="6" fill="#F8FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="80" cy="672" r="6" fill="#29B5E8"/>
  <text x="95" y="676" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">Cortex Analyst: counts, aggregates, filters, trends from structured tables</text>
  <circle cx="430" cy="672" r="6" fill="#7B1FA2"/>
  <text x="445" y="676" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">Cortex Search: find similar docs, lookup procedures, search cases</text>
  <circle cx="780" cy="672" r="6" fill="#27AE60"/>
  <text x="795" y="676" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">ML Models: predict risk, classify, forecast outcomes</text>
</svg>

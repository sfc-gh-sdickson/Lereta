<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="32" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a2e">ML Model Pipeline</text>

  <!-- Step 1: Data Preparation -->
  <rect x="30" y="60" width="190" height="270" rx="10" fill="#f0fdf4" stroke="#27AE60" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="88" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27AE60">1. Data Preparation</text>

  <rect x="50" y="100" width="150" height="52" rx="6" fill="white" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="120" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#333">Synthetic Data</text>
  <text x="125" y="138" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">10K clients, 500K properties</text>

  <text x="125" y="168" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#27AE60">&#x2193;</text>

  <rect x="50" y="178" width="150" height="52" rx="6" fill="white" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="198" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#333">Feature Engineering</text>
  <text x="125" y="216" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">18-23 features per model</text>

  <text x="125" y="246" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#27AE60">&#x2193;</text>

  <rect x="50" y="256" width="150" height="52" rx="6" fill="white" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="276" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#333">Train/Test Split</text>
  <text x="125" y="294" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">80/20 split, seed=42</text>

  <!-- Arrow 1 to 2 -->
  <line x1="220" y1="195" x2="258" y2="195" stroke="#666" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Step 2: Model Training -->
  <rect x="260" y="60" width="190" height="270" rx="10" fill="#fef2f2" stroke="#EB5757" stroke-width="2" filter="url(#shadow)"/>
  <text x="355" y="88" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#EB5757">2. Model Training</text>

  <rect x="280" y="100" width="150" height="52" rx="6" fill="white" stroke="#EB5757" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="355" y="117" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Tax Delinquency</text>
  <text x="355" y="132" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Random Forest (3 trees)</text>
  <text x="355" y="145" font-family="Inter, Arial, sans-serif" font-size="8" text-anchor="middle" fill="#999">473K training records</text>

  <rect x="280" y="162" width="150" height="52" rx="6" fill="white" stroke="#EB5757" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="355" y="179" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Client Churn</text>
  <text x="355" y="194" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">XGBoost (3 estimators)</text>
  <text x="355" y="207" font-family="Inter, Arial, sans-serif" font-size="8" text-anchor="middle" fill="#999">9K training records</text>

  <rect x="280" y="224" width="150" height="52" rx="6" fill="white" stroke="#EB5757" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="355" y="241" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Loan Risk</text>
  <text x="355" y="256" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Random Forest (3 trees)</text>
  <text x="355" y="269" font-family="Inter, Arial, sans-serif" font-size="8" text-anchor="middle" fill="#999">636K training records</text>

  <text x="355" y="310" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Snowflake ML + Snowpark</text>

  <!-- Arrow 2 to 3 -->
  <line x1="450" y1="195" x2="488" y2="195" stroke="#666" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Step 3: Model Registry -->
  <rect x="490" y="60" width="180" height="270" rx="10" fill="#eff6ff" stroke="#29B5E8" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="88" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#29B5E8">3. Model Registry</text>

  <rect x="510" y="105" width="140" height="48" rx="6" fill="white" stroke="#29B5E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="125" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#333">Model Versioning</text>
  <text x="580" y="141" font-family="Inter, Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">Immutable versions</text>

  <rect x="510" y="165" width="140" height="48" rx="6" fill="white" stroke="#29B5E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="185" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#333">Metadata</text>
  <text x="580" y="201" font-family="Inter, Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">Metrics, Features, Lineage</text>

  <rect x="510" y="225" width="140" height="48" rx="6" fill="white" stroke="#29B5E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="245" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#333">Model Artifacts</text>
  <text x="580" y="261" font-family="Inter, Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">Serialized Pipelines</text>

  <text x="580" y="305" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">ML_MODELS Schema</text>

  <!-- Arrow 3 to 4 -->
  <line x1="670" y1="195" x2="708" y2="195" stroke="#666" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Step 4: Deployment -->
  <rect x="710" y="60" width="160" height="270" rx="10" fill="#f0fdf4" stroke="#27AE60" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="88" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27AE60">4. Deployment</text>

  <rect x="725" y="105" width="130" height="45" rx="6" fill="white" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="790" y="124" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#333">SQL UDFs</text>
  <text x="790" y="140" font-family="Inter, Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">PREDICT_*() functions</text>

  <rect x="725" y="160" width="130" height="45" rx="6" fill="white" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="790" y="179" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#333">Inference Tables</text>
  <text x="790" y="195" font-family="Inter, Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">1K sample rows each</text>

  <rect x="725" y="215" width="130" height="45" rx="6" fill="white" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="790" y="234" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#333">AI Agent</text>
  <text x="790" y="250" font-family="Inter, Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">Generic tool integration</text>

  <text x="790" y="305" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Production Ready</text>

  <!-- Bottom timeline -->
  <line x1="30" y1="370" x2="870" y2="370" stroke="#E5E7EB" stroke-width="2"/>
  <circle cx="125" cy="370" r="5" fill="#27AE60"/>
  <circle cx="355" cy="370" r="5" fill="#EB5757"/>
  <circle cx="580" cy="370" r="5" fill="#29B5E8"/>
  <circle cx="790" cy="370" r="5" fill="#27AE60"/>

  <text x="125" y="395" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Data Gen + Views</text>
  <text x="355" y="395" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Warehouse Training</text>
  <text x="580" y="395" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Registry Upload</text>
  <text x="790" y="395" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">UDF + Agent Config</text>

  <!-- Footer -->
  <text x="450" y="430" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#999">
    End-to-end ML pipeline: Data Preparation &#x2192; Server-Side Training &#x2192; Model Registry &#x2192; Agent Deployment
  </text>
</svg>

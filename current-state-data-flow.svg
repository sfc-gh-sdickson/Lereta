<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 530">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="32" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Current State - Lereta Data Flow</text>

  <!-- Source Systems -->
  <text x="110" y="68" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0066CC">Source Systems</text>

  <rect x="35" y="80" width="150" height="50" fill="#E8F4F8" stroke="#0066CC" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="110" y="101" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">IBM Mainframe</text>
  <text x="110" y="118" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Linux/Containerized</text>

  <rect x="35" y="145" width="150" height="50" fill="#E8F4F8" stroke="#0066CC" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="110" y="166" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">SQL Server</text>
  <text x="110" y="183" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">On-prem EDW</text>

  <rect x="35" y="210" width="150" height="50" fill="#E8F4F8" stroke="#0066CC" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="110" y="231" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Azure SQL</text>
  <text x="110" y="248" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Elevate / LeretaNet</text>

  <rect x="35" y="275" width="150" height="50" fill="#E8F4F8" stroke="#0066CC" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="110" y="296" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Oracle</text>
  <text x="110" y="313" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">On-prem Legacy</text>

  <!-- Integration Layer -->
  <text x="320" y="68" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FF8C00">Integration</text>

  <rect x="245" y="80" width="150" height="65" fill="#FFF4E6" stroke="#FF8C00" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="320" y="103" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">SQL Gateway</text>
  <text x="320" y="120" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Mainframe Extraction</text>
  <text x="320" y="135" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Full loads (unreliable TS)</text>

  <rect x="245" y="160" width="150" height="75" fill="#FFF4E6" stroke="#FF8C00" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="320" y="183" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">SSIS Packages</text>
  <text x="320" y="200" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Template-based ETL</text>
  <text x="320" y="215" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Stored Procedures</text>
  <text x="320" y="230" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Daily + 8x critical</text>

  <rect x="245" y="250" width="150" height="50" fill="#FFF4E6" stroke="#FF8C00" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="320" y="271" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Control Center</text>
  <text x="320" y="288" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">EDWCC Orchestration</text>

  <!-- Data Warehouse -->
  <text x="545" y="68" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#228B22">Data Warehouse (160TB)</text>

  <rect x="460" y="80" width="170" height="60" fill="#E6F7E6" stroke="#228B22" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="545" y="103" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Staging (Bronze)</text>
  <text x="545" y="120" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Raw Landing Area</text>
  <text x="545" y="133" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Full + Incremental</text>

  <line x1="545" y1="140" x2="545" y2="158" stroke="#228B22" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="460" y="160" width="170" height="75" fill="#E6F7E6" stroke="#228B22" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="545" y="183" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">PSA (Silver)</text>
  <text x="545" y="200" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Persistent Staging Area</text>
  <text x="545" y="215" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">8TB, 13.7B records</text>
  <text x="545" y="230" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Hub + Stack architecture</text>

  <line x1="545" y1="235" x2="545" y2="253" stroke="#228B22" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="460" y="255" width="170" height="60" fill="#E6F7E6" stroke="#228B22" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="545" y="278" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Reporting (Gold)</text>
  <text x="545" y="295" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Dimensional Models</text>
  <text x="545" y="308" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Facts + Dimensions</text>

  <!-- Consumption Layer -->
  <text x="775" y="68" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#8B008B">Consumption</text>

  <rect x="700" y="80" width="150" height="45" fill="#F0E6FF" stroke="#8B008B" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="775" y="100" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">SSRS</text>
  <text x="775" y="115" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Deprecating</text>

  <rect x="700" y="140" width="150" height="45" fill="#F0E6FF" stroke="#8B008B" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="775" y="160" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Power BI</text>
  <text x="775" y="175" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Primary BI Tool</text>

  <rect x="700" y="200" width="150" height="45" fill="#F0E6FF" stroke="#8B008B" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="775" y="220" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Client Reporting</text>
  <text x="775" y="235" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">20-25 customers</text>

  <!-- Users -->
  <rect x="930" y="115" width="130" height="100" rx="40" fill="#FFE6E6" stroke="#CC0000" stroke-width="2" filter="url(#shadow)"/>
  <text x="995" y="150" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">End Users</text>
  <text x="995" y="170" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Management</text>
  <text x="995" y="185" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Accounting</text>
  <text x="995" y="200" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Clients</text>

  <!-- Arrows: Source to Integration -->
  <line x1="185" y1="105" x2="245" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="185" y1="170" x2="245" y2="190" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="185" y1="235" x2="245" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="185" y1="300" x2="245" y2="270" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Integration to DW -->
  <line x1="395" y1="112" x2="460" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="395" y1="197" x2="460" y2="190" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- DW to Consumption -->
  <line x1="630" y1="285" x2="700" y2="102" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="630" y1="285" x2="700" y2="162" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="630" y1="290" x2="700" y2="222" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Consumption to Users -->
  <line x1="850" y1="102" x2="930" y2="145" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="850" y1="162" x2="930" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="850" y1="222" x2="930" y2="180" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Key Characteristics -->
  <rect x="35" y="365" width="1030" height="100" rx="8" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
  <text x="55" y="390" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Key Characteristics:</text>
  <text x="55" y="410" font-family="Inter, Arial, sans-serif" font-size="10" fill="#555">PSA: Delta tracking with Hub/Stack architecture (8TB, 13.7B records)</text>
  <text x="55" y="428" font-family="Inter, Arial, sans-serif" font-size="10" fill="#555">SSIS: Template-based ETL with stored procedures, daily refresh (90%+), some 8x daily for critical data</text>
  <text x="55" y="446" font-family="Inter, Arial, sans-serif" font-size="10" fill="#555">Mainframe: Full loads due to unreliable timestamps | ~160TB total (includes indexes) | Team: 2 DE + 1 lead</text>
</svg>

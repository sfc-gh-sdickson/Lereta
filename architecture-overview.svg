<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="gradAnalyst" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#29B5E8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E88C7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gradSearch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#56CCF2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2F80ED;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gradML" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6FCF97;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#29B5E8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="35" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    Lereta Intelligence Agent Architecture
  </text>

  <!-- Agent Container -->
  <rect x="40" y="55" width="820" height="405" rx="12" fill="none" stroke="#29B5E8" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="450" y="80" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#29B5E8">
    Snowflake Intelligence Agent (9 Tools)
  </text>

  <!-- Cortex Analyst Box -->
  <rect x="60" y="100" width="240" height="145" rx="10" fill="url(#gradAnalyst)" filter="url(#shadow)"/>
  <text x="180" y="128" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Cortex Analyst</text>
  <text x="180" y="148" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.85)">Structured Data (Text-to-SQL)</text>
  <line x1="80" y1="158" x2="280" y2="158" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="180" y="178" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Property / Loan / Tax Intelligence</text>
  <text x="180" y="196" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Subscription / Revenue Intelligence</text>
  <text x="180" y="214" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Client Support Intelligence</text>
  <text x="180" y="236" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="rgba(255,255,255,0.7)">3 Semantic Views</text>

  <!-- Cortex Search Box -->
  <rect x="330" y="100" width="240" height="145" rx="10" fill="url(#gradSearch)" filter="url(#shadow)"/>
  <text x="450" y="128" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Cortex Search</text>
  <text x="450" y="148" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.85)">Unstructured Data (Semantic)</text>
  <line x1="350" y1="158" x2="550" y2="158" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="450" y="178" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Support Transcripts (25K docs)</text>
  <text x="450" y="196" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Tax Dispute Documents (15K docs)</text>
  <text x="450" y="214" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Flood Determination Reports (20K docs)</text>
  <text x="450" y="236" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="rgba(255,255,255,0.7)">3 Search Services</text>

  <!-- ML Models Box -->
  <rect x="600" y="100" width="240" height="145" rx="10" fill="url(#gradML)" filter="url(#shadow)"/>
  <text x="720" y="128" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">ML Models</text>
  <text x="720" y="148" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.85)">Predictive Analytics</text>
  <line x1="620" y1="158" x2="820" y2="158" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="720" y="178" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Tax Delinquency Predictor (RF)</text>
  <text x="720" y="196" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Client Churn Predictor (XGBoost)</text>
  <text x="720" y="214" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Loan Risk Classifier (RF)</text>
  <text x="720" y="236" font-family="Inter, Arial, sans-serif" font-size="9" text-anchor="middle" fill="rgba(255,255,255,0.7)">3 Registered Models</text>

  <!-- Arrows from pillars to data layer -->
  <line x1="180" y1="245" x2="180" y2="280" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="245" x2="450" y2="280" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="245" x2="720" y2="280" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data Platform Layer -->
  <rect x="60" y="285" width="780" height="155" rx="10" fill="#F8FAFB" stroke="#D0D5DD" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="310" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Snowflake Data Platform (LERETA_INTELLIGENCE)</text>

  <text x="100" y="335" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" fill="#555">RAW Schema:</text>
  <text x="100" y="354" font-family="Inter, Arial, sans-serif" font-size="9" fill="#666">Clients (10K)</text>
  <text x="100" y="370" font-family="Inter, Arial, sans-serif" font-size="9" fill="#666">Properties (500K)</text>
  <text x="100" y="386" font-family="Inter, Arial, sans-serif" font-size="9" fill="#666">Loans (750K)</text>
  <text x="100" y="402" font-family="Inter, Arial, sans-serif" font-size="9" fill="#666">Tax Records (559K)</text>
  <text x="100" y="418" font-family="Inter, Arial, sans-serif" font-size="9" fill="#666">Flood Certs (464K)</text>

  <text x="320" y="335" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" fill="#555">ANALYTICS Schema:</text>
  <text x="320" y="354" font-family="Inter, Arial, sans-serif" font-size="9" fill="#666">3 Semantic Views</text>
  <text x="320" y="370" font-family="Inter, Arial, sans-serif" font-size="9" fill="#666">8 Analytical Views</text>
  <text x="320" y="386" font-family="Inter, Arial, sans-serif" font-size="9" fill="#666">3 ML Feature Views</text>
  <text x="320" y="402" font-family="Inter, Arial, sans-serif" font-size="9" fill="#666">1 Intelligence Agent</text>

  <text x="560" y="335" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" fill="#555">ML_MODELS Schema:</text>
  <text x="560" y="354" font-family="Inter, Arial, sans-serif" font-size="9" fill="#666">3 Registered Models</text>
  <text x="560" y="370" font-family="Inter, Arial, sans-serif" font-size="9" fill="#666">3 Inference Tables</text>
  <text x="560" y="386" font-family="Inter, Arial, sans-serif" font-size="9" fill="#666">3 Prediction UDFs</text>
  <text x="560" y="402" font-family="Inter, Arial, sans-serif" font-size="9" fill="#666">LERETA_WH Warehouse</text>

  <!-- User Interaction Box -->
  <rect x="250" y="490" width="400" height="65" rx="10" fill="white" stroke="#29B5E8" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="517" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#29B5E8">Natural Language Queries</text>
  <text x="450" y="538" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">"Which properties are predicted to become delinquent on taxes?"</text>

  <!-- Arrow from user to agent -->
  <line x1="450" y1="490" x2="450" y2="465" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="450" y="590" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#999">
    Integrated Intelligence: Structured Analytics + Semantic Search + Predictive ML
  </text>
</svg>

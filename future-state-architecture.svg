  <text x="55" y="585" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Key Features:</text>
  <text x="55" y="605" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">Medallion Architecture (Bronze, Silver, Gold) with 5:1+ compression (~32TB from 160TB)</text>
  <text x="55" y="622" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">Multi-cluster warehouses for workload isolation | Storage: ~$8,800/year | Zero-copy cloning for dev/test</text>
  <text x="55" y="639" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">Native CDC with OpenFlow (replacing SSIS) | KPMG partnership for Phase 1 and 2 migration</text>
  <text x="600" y="605" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">Dynamic tables for real-time transformations | Time travel for data recovery</text>
  <text x="600" y="622" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">Integrated AI/ML: Model Registry + Intelligence Agents + Cortex Search</text>
  <text x="600" y="639" font-family="Inter, Arial, sans-serif" font-size="9" fill="#555">Built-in governance with tags, lineage, classification | Consumption-based pricing</text>
